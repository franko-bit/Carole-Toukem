<!DOCTYPE html>
<html lang="fr">
<head>
<script>try{var h=document.documentElement;if(matchMedia('(prefers-reduced-motion: reduce)').matches)h.classList.add('no-intro');else h.classList.add('intro-on')}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carole Toukem</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="Carole Toukem — Accompagnatrice de vie pour les francophones qui souhaitent retrouver clarté, identité et vision.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('carole-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#FFF3E6;--fg:#381932;--line:color-mix(in srgb,var(--fg) 45%,transparent);--soft:color-mix(in srgb,var(--fg) 70%,transparent);--font:"Space Grotesk",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#282B4A;--fg:#EEEBDA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#282B4A;--fg:#EEEBDA;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:calc(4rem + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-weight:700;letter-spacing:-.06em;line-height:.9}
p{letter-spacing:.02em}
a{color:inherit;text-decoration:none}
ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit;background:transparent;border:0;letter-spacing:inherit}
::selection{background:var(--fg);color:var(--bg)}
.wrap{max-width:80rem;margin:0 auto;border-inline:1px solid var(--line)}
.label{font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.small{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase}

/* first-visit intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--fg);color:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1.25rem + env(safe-area-inset-bottom,0px));cursor:pointer;transition:transform .9s cubic-bezier(.65,0,.35,1);animation:introfail 0s 7s forwards}
.intro.out{transform:translateY(-100%)}
@keyframes introfail{to{visibility:hidden;pointer-events:none}}
.no-intro .intro{display:none}
.intro-on,.intro-on body{overflow:hidden}
.intro-on body{animation:introbodyfail 0s 7s forwards}
@keyframes introbodyfail{to{overflow-x:hidden;overflow-y:auto}}
.intro-on .hero h1 span,.intro-on .portrait{animation-play-state:paused}
.ig{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);pointer-events:none}
.ig i{border-left:1px solid color-mix(in srgb,var(--bg) 25%,transparent);transform:scaleY(0);transform-origin:top;animation:draw 1.2s cubic-bezier(.65,0,.35,1) calc(var(--n)*.08s) forwards}
@keyframes draw{to{transform:scaleY(1)}}
.it,.ib{position:relative;display:flex;justify-content:space-between;gap:1rem;opacity:0;animation:fade .8s ease .5s forwards}
@keyframes fade{to{opacity:1}}
.iw{position:relative;font-size:clamp(6rem,38vw,34rem);font-weight:700;letter-spacing:-.12em;line-height:.8;overflow:hidden;padding-bottom:.06em}
.iw span{display:inline-block;transform:translateY(105%);animation:up 1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes up{to{transform:none}}
.iw span:last-child{transform:translateY(-105%);animation-name:down}
@keyframes down{from{transform:translateY(-105%)}to{transform:none}}
.ip{position:absolute;left:0;right:0;bottom:0;height:3px;background:color-mix(in srgb,var(--bg) 20%,transparent)}
.ip u{display:block;width:100%;height:100%;background:var(--bg);transform:scaleX(0);transform-origin:left}
.ib span:last-child{position:relative;padding-left:1.1rem}
.ib span:last-child::before{content:"";position:absolute;left:0;top:50%;width:.45rem;height:.45rem;margin-top:-.22rem;background:var(--bg);animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.intro{display:none}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
header .bar{max-width:80rem;margin:0 auto;height:3.5rem;display:flex;align-items:stretch;border-inline:1px solid var(--line)}
.logo{display:flex;align-items:center;padding:0 1rem;font-size:1.6rem;font-weight:700;letter-spacing:-.06em;border-right:1px solid var(--line)}
nav{display:none;flex:1}
nav a{display:flex;align-items:center;padding:0 1.25rem;border-right:1px solid var(--line);transition:background .15s,color .15s}
nav a:hover,.tbtn:hover{background:var(--fg);color:var(--bg)}
.tbtn{margin-left:auto;display:flex;align-items:center;gap:.6rem;padding:0 1rem;cursor:pointer;border-left:1px solid var(--line);transition:background .15s,color .15s}
.tbtn i{width:.75rem;height:.75rem;border:1px solid currentColor;display:block;background:linear-gradient(90deg,currentColor 50%,transparent 50%);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.tbtn:hover i{transform:rotate(180deg)}
:root[data-theme="dark"] .tbtn i{background:linear-gradient(90deg,transparent 50%,currentColor 50%)}
@media(min-width:48rem){nav{display:flex}.tbtn{margin-left:0}header .bar{height:4rem}}
@media(min-width:48rem) and (max-width:70rem){header nav{display:none}}

/* scroll progress line */
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fg);transform:scaleX(0);transform-origin:0 50%}

/* hero */
.hero{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--line)}
.hero-top{padding:3rem 1rem 1rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.hero h1{font-size:clamp(2.8rem,10.8vw,8rem);letter-spacing:-.035em;padding:1rem 1rem 0;margin-bottom:-.05em;overflow:hidden;white-space:nowrap}
.hero h1 span{display:inline-block;animation:rise .8s cubic-bezier(.16,1,.3,1) backwards;transition:transform .4s cubic-bezier(.34,1.56,.64,1);cursor:default}
.hero h1 span:hover{transform:translateY(-.07em) rotate(-5deg) scale(1.04)}
.hero h1 span:nth-child(even):hover{transform:translateY(-.07em) rotate(5deg) scale(1.04)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.hero-meta{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.hero-meta ul{padding:1rem;font-size:1.25rem;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.hero-meta .actions{padding:1rem;display:flex;flex-wrap:wrap;gap:.75rem;border-top:1px solid var(--line)}
.hero-meta .info{display:flex;flex-direction:column;justify-content:space-between}
.portrait{display:flex;align-items:center;justify-content:center;min-height:300px;background:color-mix(in srgb,var(--fg) 12%,transparent);border-top:1px solid var(--line)}
@media(min-width:48rem){.hero-meta{grid-template-columns:1.3fr 1fr}.hero-meta .info ul{margin-top:auto}.portrait{border-top:0;border-left:1px solid var(--line);min-height:380px}.hero-top{padding-top:5rem}}
@media(prefers-reduced-motion:reduce){.hero h1 span{animation:none}*{scroll-behavior:auto!important}}

/* CTA roll + magnetic pull */
.cta{position:relative;display:inline-block;overflow:hidden;border:1px solid var(--line);padding:.5rem 1rem;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;line-height:1.3;transition:background .15s,color .15s,translate .35s cubic-bezier(.16,1,.3,1)}
.cta b,.cta em{font-weight:inherit;font-style:normal;display:block;transition:transform .45s cubic-bezier(.65,0,.35,1)}
.cta em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translateY(100%)}
.cta:hover{background:var(--fg);color:var(--bg)}
.cta:hover b{transform:translateY(-200%)}
.cta:hover em{transform:translateY(0)}

/* sections */
section{border-bottom:1px solid var(--line)}
.head{padding:4rem 1rem 1.5rem;border-bottom:1px solid var(--line)}
.head h2{font-size:clamp(3rem,10vw,6.5rem);margin-top:.75rem}
.head .label{transition:letter-spacing .5s cubic-bezier(.16,1,.3,1)}
.head:hover .label{letter-spacing:.32em}
.split{display:grid;grid-template-columns:1fr}
.split>div{padding:2.5rem 1rem;display:flex;flex-direction:column;align-items:flex-start;gap:2rem}
.split p.lead{max-width:46ch;font-size:1.2rem;line-height:1.6}
.ph{position:relative;overflow:hidden;min-height:260px;background:color-mix(in srgb,var(--fg) 12%,transparent);align-items:center!important;justify-content:center}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,color-mix(in srgb,var(--fg) 14%,transparent) 50%,transparent 65%);transform:translateX(-100%);animation:sweep 5s ease-in-out infinite}
.ph:has(.city-map){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch!important;justify-content:stretch;gap:1px;padding:0!important;background:var(--line)}
.ph:has(.city-map)::after{display:none}
.city-map{position:relative;display:block;min-width:0;min-height:200px;overflow:hidden;background:var(--bg);isolation:isolate}
.city-map-art{position:absolute;inset:0;width:100%;height:100%;min-height:200px;object-fit:cover;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.city-map:hover .city-map-art{transform:scale(1.035)}
.map-place-label{position:absolute;z-index:2;max-width:calc(100% - 1rem);padding:.25rem .35rem;background:color-mix(in srgb,var(--bg) 92%,transparent);color:var(--fg);font-size:.52rem;font-weight:700;letter-spacing:.1em;line-height:1.2;white-space:nowrap;transform:translate(-50%,-50%)}
.city-map-kicker,.city-map-label,.city-map-open{position:absolute;z-index:2;background:var(--bg);color:var(--fg)}
.city-map-kicker{top:.75rem;left:.75rem;display:flex;align-items:center;gap:.55rem;padding:.45rem .6rem;font-size:.55rem;letter-spacing:.13em}
.city-map-kicker span{display:grid;width:1.15rem;height:1.15rem;place-items:center;background:var(--fg);color:var(--bg);font-size:.55rem;letter-spacing:0}
.city-map-label{left:.75rem;bottom:.75rem;display:flex;flex-direction:column;gap:.2rem;padding:.55rem .7rem;border-left:2px solid var(--fg)}
.city-map-label strong{font-size:1rem;line-height:1.1;letter-spacing:-.04em}
.city-map-label small{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;opacity:.72}
.city-map-open{right:.75rem;bottom:.75rem;padding:.5rem .6rem;font-size:.52rem;letter-spacing:.12em}
.city-map-open span{font-size:.8rem;margin-left:.25rem}
.city-map-credit{position:absolute;z-index:2;right:.4rem;top:.45rem;max-width:52%;padding:.2rem .3rem;background:color-mix(in srgb,var(--bg) 85%,transparent);color:var(--fg);font-size:.42rem;line-height:1.25;text-align:right}
.city-map-marker{position:absolute;z-index:1;left:50%;top:50%;width:1.4rem;height:1.4rem;border:1px solid var(--fg);border-radius:50%;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--bg) 62%,transparent);pointer-events:none}
.city-map-marker-sf{left:58%;top:54%}
.city-map-marker-tlv{left:58%;top:51%}
.city-map-marker::before{content:"";position:absolute;inset:.32rem;border-radius:50%;background:var(--fg)}
.city-map-marker::after{content:"";position:absolute;inset:-.35rem;border:1px solid color-mix(in srgb,var(--fg) 60%,transparent);border-radius:50%;animation:mapPing 2.4s ease-out infinite}
@keyframes mapPing{0%{transform:scale(.7);opacity:.65}100%{transform:scale(1.8);opacity:0}}
.city-map:focus-visible{outline:2px solid var(--fg);outline-offset:-3px}
.city-map:focus-visible .city-map-art{transform:scale(1.035)}
.about-video{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;overflow:hidden;background:var(--line);animation:videoReveal 1.2s cubic-bezier(.16,1,.3,1) .25s both}
.about-video iframe{display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--line);background:var(--fg)}
@keyframes videoReveal{from{clip-path:inset(0 42%)}to{clip-path:inset(0)}}
@keyframes sweep{0%,30%{transform:translateX(-100%)}70%,100%{transform:translateX(100%)}}
@media(min-width:48rem){.split{grid-template-columns:5fr 6fr}.split>div:first-child{border-right:1px solid var(--line)}.split>div{padding:4rem 1.5rem}.ph{min-height:420px}.city-map,.city-map-art{min-height:420px}.head{padding:7rem 1.5rem 2rem}}
@media(max-width:47.999rem){.about-video{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.city-map-marker::after{animation:none}.city-map-art{transition:none}.about-video{animation:none}}

/* rows */
.row{display:grid;grid-template-columns:3rem 1fr;border-bottom:1px solid var(--line);transition:background .2s,color .2s}
.portfolio-row{position:relative;grid-template-columns:3rem minmax(0,1fr)}
.portfolio-row:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--fg);color:var(--bg)}
.row>*{padding:1rem}
.row .n{opacity:.6;font-size:.7rem;letter-spacing:.18em}
.row h3{font-size:1.7rem;font-weight:600;letter-spacing:-.03em;line-height:1.05;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.row:hover h3{transform:translateX(.6rem)}
.portfolio-name{display:flex;align-items:center;gap:.85rem}
.row .d{grid-column:2;font-size:.95rem;opacity:.85;padding-top:0;max-width:60ch}
.row .tags{grid-column:2;padding-top:0;display:flex;gap:1rem;flex-wrap:wrap;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.row:hover .tags{transform:translateX(-.4rem)}
.tags li.live::before{content:"";display:inline-block;width:.45em;height:.45em;margin-right:.6em;background:currentColor;border-radius:50%;animation:live 1.8s ease-in-out infinite}
@keyframes live{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.4}}
@media(min-width:48rem){
.row{grid-template-columns:4rem 1fr 1fr 14rem}
.portfolio-row{grid-template-columns:4rem minmax(0,1fr) minmax(0,1.4fr)}
.row>*{padding:1.5rem 1rem}
.row h3{font-size:2.25rem}
.row .d{grid-column:auto;padding-top:1.5rem;align-self:center}
.row .tags{grid-column:auto;padding-top:1.5rem;flex-direction:column;gap:.25rem;text-align:right;align-self:center}
.row.slim{grid-template-columns:4rem 1fr 1fr}
.row.slim .tags{display:none}}
/* form */
form{padding:2.5rem 1rem;display:flex;flex-direction:column;gap:1rem;width:100%}
.fg{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:48rem){.fg{grid-template-columns:1fr 1fr}form{padding:4rem 1.5rem}}
label{display:flex;flex-direction:column;gap:.25rem}
input,select,textarea{border:1px solid var(--line);padding:.6rem .75rem;font-size:1rem;letter-spacing:0;text-transform:none;outline:none;width:100%;transition:border-color .2s,box-shadow .35s cubic-bezier(.16,1,.3,1)}
input:focus,select:focus,textarea:focus{border-color:var(--fg);box-shadow:inset 0 -3px 0 var(--fg)}
select option{background:var(--bg);color:var(--fg)}
.row-act{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
#ps.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:.75;transform:none}}

/* footer */
footer{background:var(--fg);color:var(--bg)}
footer nav{display:flex;border-bottom:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
footer nav a{flex:1;justify-content:center;padding:2rem 1rem;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
footer nav a:last-child{border-right:0}
footer nav a:hover{background:var(--bg);color:var(--fg)}
.foot{max-width:80rem;margin:0 auto;border-inline:1px solid color-mix(in srgb,var(--bg) 40%,transparent);padding:2.5rem 1rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2rem}
.foot ul{display:flex;flex-direction:column;gap:.5rem;text-transform:uppercase;letter-spacing:.06em;font-size:1.1rem}
.foot a:hover{text-decoration:underline}
.foot p{opacity:.75;max-width:30ch}
.big{max-width:80rem;margin:0 auto;border-inline:1px solid color-mix(in srgb,var(--bg) 40%,transparent);overflow:hidden;text-align:center;font-size:30vw;font-weight:700;letter-spacing:-.22em;line-height:.7;padding:0 1rem;margin-bottom:calc(-.14em + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity 1s,letter-spacing 1.4s cubic-bezier(.16,1,.3,1)}
.big.go{opacity:1;letter-spacing:-.13em}
@media(min-width:80rem){.big{font-size:24rem}}

/* nav dots */
.rail{position:fixed;right:max(.5rem,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;gap:.15rem}
.rail a{display:flex;align-items:center;justify-content:flex-end;height:1.75rem;min-width:1.75rem;gap:.6rem}
.rail a span{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;background:var(--bg);padding:.1rem .4rem;opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .3s,transform .45s cubic-bezier(.16,1,.3,1)}
.rail a:hover span,.rail a:focus-visible span{opacity:1;transform:none}
.rail i{position:relative;width:.5rem;height:.5rem;margin-right:.5rem;border:1px solid var(--fg);display:block;transition:transform .45s cubic-bezier(.65,0,.35,1),background .3s}
.rail a:hover i{transform:scale(1.5)}
.rail a.on i{background:var(--fg);transform:rotate(45deg) scale(1.25)}
.rail a.on i::after{content:"";position:absolute;inset:-5px;border:1px solid var(--fg);animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.6}80%,100%{transform:scale(1.7);opacity:0}}
@media(max-width:47.999rem){.rail{display:none}}
header nav a::before{content:"";width:.35rem;height:.35rem;background:var(--fg);margin-right:0;transform:scale(0);transition:transform .35s cubic-bezier(.65,0,.35,1),margin .35s,background .15s}
header nav a.on::before{transform:scale(1);margin-right:.5rem}
header nav a:hover::before{background:var(--bg)}

/* motion */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
.portrait{position:relative;overflow:hidden;animation:clip 1.3s cubic-bezier(.16,1,.3,1) .3s both}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.1);translate:0 var(--py,0px);transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.portrait:hover img{transform:scale(1)}
@keyframes clip{from{clip-path:inset(0 37%)}to{clip-path:inset(0 0)}}
.mqw{display:block;height:2.5rem;overflow:hidden;border-top:1px solid var(--line);transition:background .2s,color .2s}
.mqw:hover{background:var(--fg);color:var(--bg)}
.mq{display:flex;width:max-content;height:100%;align-items:center;animation:mq 45s linear infinite}
.mqw:hover .mq{animation-play-state:paused}
.mq span{white-space:nowrap;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase}
.mq b{padding:0 1.5rem;opacity:.4;font-weight:400}
@keyframes mq{to{transform:translateX(-50%)}}

/* playful punctuation */
.dot{display:inline-block;transform-origin:50% 88%;will-change:transform;scale:1;transition:scale .6s cubic-bezier(.34,1.56,.64,1),opacity .4s}
.head:not(.go) .dot{opacity:0;scale:0}

/* thesis: squash-and-stretch bounce */
.head.go .d-bounce{animation:dBounce 3.2s cubic-bezier(.3,0,.4,1) .8s infinite}
@keyframes dBounce{
  0%{transform:none}
  8%{transform:translateY(-.35em) scale(.9,1.15)}
  16%{transform:translateY(0) scale(1.25,.7)}
  22%{transform:translateY(-.14em) scale(.96,1.05)}
  28%,100%{transform:none}
}

/* portfolio: pop, then a heartbeat pulse with an echo ring */
.d-pulse{position:relative}
.d-pulse::after{content:"";position:absolute;left:.08em;bottom:.04em;width:.11em;height:.11em;border:1px solid currentColor;border-radius:50%;opacity:0}
.head.go .d-pulse{animation:dPulse 2.8s ease-in-out .8s infinite}
.head.go .d-pulse::after{animation:dRing 2.8s ease-out .8s infinite}
@keyframes dPulse{
  0%{transform:none}
  12%{transform:scale(1.5)}
  22%{transform:scale(.9)}
  30%{transform:scale(1)}
  60%{transform:scale(1.18)}
  75%,100%{transform:scale(1)}
}
@keyframes dRing{0%,45%{transform:scale(1);opacity:0}50%{opacity:.7}100%{transform:scale(3.4);opacity:0}}

/* insights: spins into a diamond (echoes the nav marker), then back */
.head.go .d-flip{animation:dFlip 3.6s cubic-bezier(.65,0,.35,1) 1s infinite}
@keyframes dFlip{
  0%,40%{transform:none}
  55%{transform:rotate(180deg) scale(1.15)}
  62%,80%{transform:rotate(225deg) scale(1.15)}
  95%,100%{transform:rotate(360deg) scale(1)}
}

/* chat: curious head-tilt hop */
.head.go .d-tilt{animation:dTilt 3.4s ease-in-out 1s infinite}
@keyframes dTilt{
  0%,45%{transform:none}
  52%{transform:translateY(-.1em) rotate(-14deg)}
  60%{transform:translateY(0) rotate(10deg)}
  68%{transform:rotate(-6deg)}
  76%,100%{transform:none}
}

/* cursor follower (mouse only) */
.cur{position:fixed;left:0;top:0;width:.7rem;height:.7rem;border:1px solid var(--fg);z-index:60;pointer-events:none;transform:translate(-50%,-50%);transition:width .3s cubic-bezier(.16,1,.3,1),height .3s cubic-bezier(.16,1,.3,1),background .3s,opacity .3s;opacity:0}
.cur.on{opacity:1}
.cur.big-c{width:2.6rem;height:2.6rem;background:color-mix(in srgb,var(--fg) 12%,transparent)}
@media(hover:none){.cur{display:none}}

@media(prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  .rail a.on i::after,.mq,.portrait,.ph::after,.tags li.live::before{animation:none}
  .portrait img{transition:none}
  .head:not(.go) .dot{opacity:1;scale:1}
  .head.go .dot,.head.go .d-pulse::after{animation:none!important}
  .big{opacity:1;letter-spacing:-.13em;transition:none}
  .cur{display:none}
  .row:hover h3,.row:hover .tags,.hero h1 span:hover{transform:none}
}
</style>
</head>
<body>
<div class="intro" id="intro" role="status" aria-label="Loading">
  <div class="ig" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i></div>
  <div class="it small"><b id="ic" style="font-variant-numeric:tabular-nums;font-weight:700">000</b>%</span></div>
  <div class="iw" aria-hidden="true"><span style="animation-delay:.4s">c</span><span style="animation-delay:.44s">a</span><span style="animation-delay:.48s">r</span><span style="animation-delay:.52s">o</span><span style="animation-delay:.56s">l</span><span style="animation-delay:.6s">e</span><span style="animation-delay:.64s">.</span></div>
  <div class="ip"><u id="ibar"></u></div>
</div>
<div id="root"></div>
<script>
(function(){
  var root=document.documentElement,intro=document.getElementById('intro');
  if(!intro||root.classList.contains('no-intro'))return;
  var ic=document.getElementById('ic'),bar=document.getElementById('ibar'),t0=null,dur=2300,fin=false;
  function done(){
    if(fin)return;fin=true;
    intro.classList.add('out');
    document.removeEventListener('keydown',onKey);
    setTimeout(function(){root.classList.remove('intro-on')},900);
    setTimeout(function(){intro.style.display='none'},1000);
  }
  function onKey(e){if(e.key==='Escape'||e.key==='Enter')done()}
  function step(t){
    if(fin)return;if(!t0)t0=t;
    var p=Math.min((t-t0)/dur,1),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    ic.textContent=String(Math.round(e*100)).padStart(3,'0');
    bar.style.transform='scaleX('+e+')';
    if(p<1)requestAnimationFrame(step);else setTimeout(done,200);
  }
  requestAnimationFrame(step);
  intro.addEventListener('click',done,{once:true});
  document.addEventListener('keydown',onKey);
})();
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
